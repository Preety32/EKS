name: CI/CD Pipeline Using Github Actions

on:
  push:
    branches:
      - Master
  pull_request:
    branches:
      - Master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout Code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up NodeJS 
      - name: Set up NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      # Install NodeJS dependencies
      - name: Install NodeJS dependencies
        run: npm install
 
      # Docker Image Build
      - name: Build Docker Image
        run: docker build -t $GITHUB_SHA .

      # Trivy Scan
      - name: Trivy Scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image $GITHUB_SHA
   
      - name: Debug values
        run: |
          echo 'GitHub SHA: ${{ github.sha }}'
          echo 'ECR URI: ${{ secrets.ECR_REPOSITORY_URI }}'


  
#      # Docker Image Build
#      - name: Build Docker Image
#        run: |    
#          docker build -t actions-app:${{ github.sha}} .
#          docker tag actions-app:${{ github.sha}} ${{ secrets.ECR_REPOSITORY_URI}}/actions-app:latest

      # Docker Image Build
      - name: Build Docker Image
        run: |    
          docker build -t ecr:${{ github.sha}} .
          docker tag ecr:${{ github.sha}} ${{ secrets.ECR_REPOSITORY_URI }}/ecr:latest


      
      # Set up AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Log in to Amazon ECR
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}


      - name: Push image to Amazon ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY_URI }}/ecr:latest




      # Push image to Amazon ECR
#      - name: Push image to Amazon ECR
#        run: |
#          docker push ${{ secrets.ECR_REPOSITORY_URI}}/actions-app:latest
#        env:
#          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
#          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
#          aws-region: ${{ secrets.AWS_REGION }}


      # Install kubectl
      - name: Install kubectl
        run: |
          mkdir -p /tmp/kubectl
          curl -o /tmp/kubectl/kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.21.2/2021-07-05/bin/linux/amd64/kubectl
          chmod +x /tmp/kubectl/kubectl
          export PATH=/tmp/kubectl:$PATH

      # Update Kubeconfig
      - name: Update kubeconfig
        run: aws eks --region ${{ secrets.AWS_REGION }} update-kubeconfig --name actions-eks-cluster
         env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      # Update Authenticate Kubernetes
      - name: Authenticate Kubernetes client
        run: |
          TOKEN=$(aws eks get-token --cluster-name actions-eks-cluster | jq -r '.status.token')
          kubectl config set-credentials actions-eks-cluster --token=$TOKEN
         env:
           AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
           AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           AWS_REGION: ${{ secrets.AWS_REGION }}  


      # Validate kubeconfig
      - name: Validate kubeconfig
        run: |
          kubectl get nodes
         env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      # Deploy to Amazon EKS
      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s-manifests/deployment.yaml
          kubectl apply -f k8s-manifests/service.yaml
         env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}  
  
       
    
